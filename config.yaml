# GM Server 配置文件
# 支持格式：YAML、JSON、TOML
# 环境变量优先级高于配置文件

# 服务器配置
server:
  host: "0.0.0.0"  # 监听地址
  port: 8080        # 监听端口

# 数据库配置
database:
  host: "localhost"           # 数据库主机
  port: 5432                 # 数据库端口
  user: "postgres"           # 数据库用户
  password: 123456       # 数据库密码（建议使用环境变量）
  dbname: "gm_server"        # 数据库名称
  sslmode: "disable"         # SSL模式: disable, require, verify-ca, verify-full
  max_open_conns: 100        # 最大打开连接数
  max_idle_conns: 10         # 最大空闲连接数
  conn_max_lifetime: 3600    # 连接最大生存时间（秒）
  conn_max_idle_time: 300    # 连接最大空闲时间（秒）

# 日志配置
log:
  level: "info"              # 日志级别: debug, info, warn, error
  encoding: "console"        # 日志格式: json, console（开发环境建议用console）
  output_path: ""            # 日志输出路径，空则输出到stdout
  error_path: ""             # 错误日志路径，空则输出到stderr

# Web功能配置
web:
  host: "0.0.0.0"            # Web服务监听地址
  port: 8080                 # Web服务监听端口
  resend_batch_size: 1000    # 批量补发时每批处理的玩家数量
  resend_batch_workers: 50   # 批量补发的并发工作协程数
  resend_rank_workers: 32    # 按排名补发的并发工作协程数
  resend_http_timeout_sec: 30 # HTTP请求超时时间（秒）

# 中间件配置
middleware:
  # 请求日志配置
  request_logger:
    enabled: true

  # 性能监控配置
  performance_monitor:
    enabled: true
    slow_threshold: "1s"
    max_slow_requests: 100

  # 安全配置
  security:
    max_request_body_size: 10485760  # 10MB
    max_header_size: 8192             # 8KB

# 认证配置
auth:
  jwt:
    secret_key: "change-me-in-production"  # 生产环境必须修改！
    expiration: "24h"
    refresh_exp: "168h"
    issuer: "gm-server"
  password:
    min_length: 8
    require_upper: false
    require_lower: true
    require_number: false
    require_special: false
  session:
    max_login_attempts: 5
    lockout_duration: "30m"
