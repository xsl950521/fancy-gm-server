# 测试环境配置文件

# 服务器配置
server:
  host: "127.0.0.1"
  port: 8081  # 使用不同的端口避免冲突

# 数据库配置（测试数据库）
database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "gm_server_test"  # 测试数据库
  sslmode: "disable"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 3600
  conn_max_idle_time: 300

# 日志配置
log:
  level: "debug"  # 测试时使用debug级别
  encoding: "console"  # 测试时使用console格式
  output_path: ""
  error_path: ""

# Web功能配置
web:
  host: "127.0.0.1"
  port: 8081
  resend_batch_size: 100
  resend_batch_workers: 10
  resend_rank_workers: 5
  resend_http_timeout_sec: 10

# 中间件配置
middleware:
  request_logger:
    enabled: false  # 测试时关闭请求日志
  performance_monitor:
    enabled: false  # 测试时关闭性能监控
    slow_threshold: "1s"
    max_slow_requests: 100
  security:
    max_request_body_size: 10485760  # 10MB
    max_header_size: 8192
